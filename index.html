<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C# тестирование учеников</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body {
      background: linear-gradient(145deg, #f0f2f5 0%, #e9ecef 100%);
      min-height: 100vh;
      padding: 20px;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }
    .test-container { max-width: 920px; margin: 0 auto; }
    .question-card {
      background-color: #ffffff;
      border: none;
      border-radius: 24px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.02);
    }
    .question-text {
      font-weight: 600;
      font-size: 1.3rem;
      color: #1e293b;
      line-height: 1.5;
    }
    .option-item {
      background: #f8fafc;
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 12px;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .option-item:hover {
      background: #eef2ff;
      border-color: #a5b4fc;
      transform: translateX(4px);
    }
    .option-item.selected {
      background: #e0e7ff;
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }
    .option-item input[type="radio"] {
      width: 20px; height: 20px;
      accent-color: #4f46e5;
      margin-right: 4px;
      flex-shrink: 0;
    }
    .option-label {
      font-size: 1.05rem;
      color: #1e293b;
      cursor: pointer;
      flex: 1;
      margin: 0;
    }
    .progress { height: 10px; border-radius: 12px; background-color: #e2e8f0; }
    .progress-bar {
      background: linear-gradient(90deg, #4f46e5, #818cf8);
      border-radius: 12px;
      transition: width 0.3s ease;
    }
    .badge-step {
      background: #e0e7ff;
      color: #4338ca;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.9rem;
    }
    .btn-primary {
      background: #4f46e5; border: none;
      border-radius: 40px;
      padding: 10px 28px;
      font-weight: 600;
      box-shadow: 0 6px 14px rgba(79, 70, 229, 0.3);
    }
    .btn-primary:hover { background: #4338ca; transform: translateY(-1px); }
    .btn-outline-secondary {
      border-radius: 40px;
      padding: 10px 24px;
      font-weight: 500;
      border-color: #cbd5e1;
      color: #475569;
    }
    .result-card {
      background: white;
      border-radius: 28px;
      padding: 2rem;
      box-shadow: 0 20px 40px -8px rgba(0, 0, 0, 0.12);
    }
    .score-circle {
      width: 120px; height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f46e5, #818cf8);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
      color: white;
      font-size: 2.4rem;
      font-weight: 700;
      box-shadow: 0 12px 24px -6px rgba(79, 70, 229, 0.5);
    }
    .feedback-emoji { font-size: 3.5rem; line-height: 1; margin-bottom: 0.5rem; }
    .topic-badge {
      background: #fef3c7;
      color: #92400e;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 500;
    }
    .loading-spinner {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 0;
    }
    @media (max-width: 576px) {
      .question-text { font-size: 1.15rem; }
      .option-item { padding: 12px 14px; }
      .score-circle { width: 90px; height: 90px; font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <div class="test-container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="display-6 fw-bold" style="color: #0f172a;">🧪 Тест по C#</h1>
        <p class="text-secondary-emphasis">Проверь свои знания основ языка C#</p>
      </div>
      <i class="bi bi-braces-asterisk fs-1 text-primary opacity-50 d-none d-sm-block"></i>
    </div>

    <div id="progressSection" class="mb-4 d-none">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <span class="badge-step" id="progressText">Вопрос 1 из 20</span>
        <span class="text-secondary small" id="progressPercent">0%</span>
      </div>
      <div class="progress">
        <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%;"></div>
      </div>
    </div>

    <div id="quizArea" class="question-card p-4 p-md-5">
      <div class="loading-spinner">
        <div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;">
          <span class="visually-hidden">Загрузка...</span>
        </div>
        <p class="text-secondary">Загружаем вопросы из Google Таблицы...</p>
      </div>
    </div>

    <div id="resultArea" class="result-card d-none text-center"></div>
  </div>

  <script>
    (function() {
      // ------------------------------
      // Ссылка на опубликованную TSV Google Таблицы
      // ------------------------------
      const SHEET_TSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSoazCGiivCIJuiWUcUuvvGkpDajpvrTcfxzRnyeWhdBPMGVlVtSmuPp2Wn7DmOnU3zJw-SRb2MPUms/pub?output=tsv';

      // Состояние теста
      let questions = [];         // массив загруженных вопросов
      let currentQuestionIndex = 0;
      let selectedAnswers = [];
      let score = 0;

      // DOM элементы
      const quizArea = document.getElementById('quizArea');
      const resultArea = document.getElementById('resultArea');
      const progressSection = document.getElementById('progressSection');
      const progressText = document.getElementById('progressText');
      const progressPercent = document.getElementById('progressPercent');
      const progressBar = document.getElementById('progressBar');

      // ------------------------------
      // Загрузка и парсинг TSV
      // ------------------------------
      async function loadQuestionsFromSheet() {
        const res = await fetch(SHEET_TSV_URL, { cache: 'no-cache' });
        if (!res.ok) throw new Error('Ошибка загрузки: ' + res.status);
        const text = await res.text();
        return parseTSV(text);
      }

      // Простой парсер TSV (табы — разделители, кавычки не поддерживаются,
      // но для нашего случая достаточно)
      function parseTSV(text) {
        const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
        const rows = [];
        for (const line of lines) {
          if (line.trim() === '') continue;
          rows.push(line.split('\t').map(cell => cell.trim()));
        }
        return rows;
      }

      // Преобразование строк TSV в объекты вопросов
      // Столбцы: N | Тема | Вопрос | Вар1 | Вар2 | Вар3 | Вар4 | НомерПравильного
      function rowsToQuestions(rows) {
        if (rows.length < 2) throw new Error('В таблице нет данных');

        // Пропускаем заголовок
        const dataRows = rows.slice(1);
        const result = [];
        dataRows.forEach((r, idx) => {
          if (r.length < 8) return; // пропустить некорректные строки
          const number = parseInt(r[0], 10);
          const topic = r[1];
          const questionText = r[2];
          const options = [r[3], r[4], r[5], r[6]].filter(o => o !== '');
          const correctNum = parseInt(r[7], 10); // 1..4

          if (!questionText || options.length < 2) return;
          if (isNaN(correctNum) || correctNum < 1 || correctNum > options.length) return;

          result.push({
            number: isNaN(number) ? idx + 1 : number,
            topic: topic,
            text: questionText,
            options: options,
            correct: correctNum - 1 // в 0-индексацию
          });
        });
        return result;
      }

      // ------------------------------
      // Инициализация
      // ------------------------------
      async function init() {
        try {
          const rows = await loadQuestionsFromSheet();
          questions = rowsToQuestions(rows);
          if (questions.length === 0) throw new Error('Не удалось распознать ни одного вопроса');
          resetQuiz();
        } catch (err) {
          console.error(err);
          quizArea.innerHTML = `
            <div class="alert alert-danger mb-0" role="alert">
              <h5 class="alert-heading"><i class="bi bi-exclamation-triangle"></i> Не удалось загрузить вопросы</h5>
              <p class="mb-2">${escapeHtml(err.message)}</p>
              <hr>
              <p class="mb-0 small">
                Проверьте, что таблица опубликована в интернете (Файл → Поделиться → Опубликовать в интернете),
                доступна по ссылке и содержит колонки:
                <code>N | Тема | Вопрос | Вар1 | Вар2 | Вар3 | Вар4 | НомерПравильного</code>.
              </p>
              <button class="btn btn-primary mt-3" onclick="location.reload()">
                <i class="bi bi-arrow-clockwise"></i> Повторить
              </button>
            </div>
          `;
        }
      }

      function resetQuiz() {
        currentQuestionIndex = 0;
        selectedAnswers = new Array(questions.length).fill(null);
        score = 0;
        resultArea.classList.add('d-none');
        resultArea.innerHTML = '';
        quizArea.classList.remove('d-none');
        progressSection.classList.remove('d-none');
        renderQuestion(0);
        updateProgress();
      }

      function updateProgress() {
        const total = questions.length;
        const answered = selectedAnswers.filter(a => a !== null).length;
        const percent = Math.round((answered / total) * 100);
        progressText.textContent = `Вопрос ${currentQuestionIndex + 1} из ${total}`;
        progressPercent.textContent = `${percent}%`;
        progressBar.style.width = `${percent}%`;
      }

      function renderQuestion(index) {
        const q = questions[index];
        const selected = selectedAnswers[index];

        let optionsHtml = '';
        q.options.forEach((opt, optIndex) => {
          const isSelected = (selected === optIndex);
          optionsHtml += `
            <div class="option-item ${isSelected ? 'selected' : ''}" data-option-index="${optIndex}">
              <input class="form-check-input" type="radio" name="questionOptions"
                     id="opt_${optIndex}" value="${optIndex}" ${isSelected ? 'checked' : ''}>
              <label class="option-label" for="opt_${optIndex}">${escapeHtml(opt)}</label>
            </div>
          `;
        });

        const isFirst = (index === 0);
        const isLast = (index === questions.length - 1);
        const hasSelected = (selected !== null && selected !== undefined);

        let navButtons = `
          <div class="d-flex justify-content-between align-items-center mt-4 pt-2">
            <button id="prevBtn" class="btn btn-outline-secondary" ${isFirst ? 'disabled' : ''}>
              <i class="bi bi-arrow-left"></i> Назад
            </button>
            <div>
              ${!isLast ? `<button id="nextBtn" class="btn btn-primary" ${!hasSelected ? 'disabled' : ''}>Далее <i class="bi bi-arrow-right"></i></button>` : ''}
              ${isLast ? `<button id="finishBtn" class="btn btn-primary" ${!hasSelected ? 'disabled' : ''}>Завершить тест <i class="bi bi-check-lg"></i></button>` : ''}
            </div>
          </div>
        `;

        quizArea.innerHTML = `
          <div class="d-flex justify-content-between align-items-start mb-2">
            <div>
              ${q.topic ? `<span class="topic-badge">${escapeHtml(q.topic)}</span>` : ''}
            </div>
            <span class="badge-step ms-2">${index + 1}/${questions.length}</span>
          </div>
          <h4 class="question-text mb-3">${escapeHtml(q.text)}</h4>
          <div class="mt-3" id="optionsContainer">
            ${optionsHtml}
          </div>
          ${navButtons}
        `;

        const optionDivs = quizArea.querySelectorAll('.option-item');
        optionDivs.forEach(div => {
          div.addEventListener('click', function(e) {
            if (e.target.tagName === 'INPUT') return;
            const radio = this.querySelector('input[type="radio"]');
            if (radio) {
              radio.checked = true;
              optionDivs.forEach(d => d.classList.remove('selected'));
              this.classList.add('selected');
              const optIndex = parseInt(this.dataset.optionIndex, 10);
              handleOptionSelect(optIndex);
            }
          });
        });

        const radioInputs = quizArea.querySelectorAll('input[type="radio"]');
        radioInputs.forEach(radio => {
          radio.addEventListener('change', function(e) {
            e.stopPropagation();
            const optIndex = parseInt(this.value, 10);
            const parentDiv = this.closest('.option-item');
            optionDivs.forEach(d => d.classList.remove('selected'));
            parentDiv.classList.add('selected');
            handleOptionSelect(optIndex);
          });
        });

        const prevBtn = document.getElementById('prevBtn');
        if (prevBtn) {
          prevBtn.addEventListener('click', () => {
            if (currentQuestionIndex > 0) {
              currentQuestionIndex--;
              renderQuestion(currentQuestionIndex);
              updateProgress();
            }
          });
        }

        const nextBtn = document.getElementById('nextBtn');
        if (nextBtn) {
          nextBtn.addEventListener('click', () => {
            if (selectedAnswers[currentQuestionIndex] === null) return;
            if (currentQuestionIndex < questions.length - 1) {
              currentQuestionIndex++;
              renderQuestion(currentQuestionIndex);
              updateProgress();
            }
          });
        }

        const finishBtn = document.getElementById('finishBtn');
        if (finishBtn) {
          finishBtn.addEventListener('click', () => {
            if (selectedAnswers[currentQuestionIndex] === null) return;
            finishQuiz();
          });
        }

        updateProgress();
      }

      function handleOptionSelect(optIndex) {
        if (selectedAnswers[currentQuestionIndex] === optIndex) return;
        selectedAnswers[currentQuestionIndex] = optIndex;
        const nextBtn = document.getElementById('nextBtn');
        const finishBtn = document.getElementById('finishBtn');
        if (nextBtn) nextBtn.disabled = false;
        if (finishBtn) finishBtn.disabled = false;
        updateProgress();
      }

      function finishQuiz() {
        let correctCount = 0;
        questions.forEach((q, idx) => {
          if (selectedAnswers[idx] === q.correct) correctCount++;
        });
        const total = questions.length;
        const percent = Math.round((correctCount / total) * 100);

        progressSection.classList.add('d-none');
        quizArea.classList.add('d-none');
        resultArea.classList.remove('d-none');

        let emoji, message;
        if (percent === 100) { emoji = '🏆'; message = 'Идеально! Ты настоящий C#-ниндзя!'; }
        else if (percent >= 80) { emoji = '🌟'; message = 'Отличный результат! Ты хорошо знаешь C#.'; }
        else if (percent >= 60) { emoji = '👍'; message = 'Неплохо! Но есть куда расти.'; }
        else if (percent >= 40) { emoji = '📘'; message = 'Стоит повторить основы C#.'; }
        else { emoji = '💪'; message = 'Не расстраивайся! Попробуй ещё раз, практика — путь к успеху.'; }

        // Разбор по темам
        const topicStats = {};
        questions.forEach((q, idx) => {
          const t = q.topic || 'Без темы';
          if (!topicStats[t]) topicStats[t] = { correct: 0, total: 0 };
          topicStats[t].total++;
          if (selectedAnswers[idx] === q.correct) topicStats[t].correct++;
        });
        let topicHtml = '';
        Object.entries(topicStats).forEach(([t, s]) => {
          const p = Math.round((s.correct / s.total) * 100);
          const cls = p >= 80 ? 'success' : p >= 50 ? 'warning' : 'danger';
          topicHtml += `
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="small">${escapeHtml(t)}</span>
              <span class="badge bg-${cls}-subtle text-${cls}-emphasis">
                ${s.correct}/${s.total} (${p}%)
              </span>
            </div>
          `;
        });

        resultArea.innerHTML = `
          <div class="feedback-emoji">${emoji}</div>
          <h2 class="fw-bold mb-3" style="color: #0f172a;">Результат</h2>
          <div class="score-circle mb-3">${correctCount}/${total}</div>
          <p class="fs-5 fw-semibold mb-1">${percent}% правильных ответов</p>
          <p class="text-secondary mb-4">${message}</p>
          <div class="mb-4">
            <button id="restartBtn" class="btn btn-primary px-4">
              <i class="bi bi-arrow-repeat me-1"></i> Пройти заново
            </button>
          </div>
          ${topicHtml ? `
            <div class="text-start border-top pt-3 mb-3">
              <h6 class="fw-bold mb-2">Результат по темам:</h6>
              ${topicHtml}
            </div>
          ` : ''}
          <details class="text-start small text-secondary">
            <summary class="fw-semibold mb-2" style="cursor: pointer;">
              <i class="bi bi-info-circle me-1"></i> Показать правильные ответы
            </summary>
            <ol class="ps-3 mb-0">
              ${questions.map((q, i) => `
                <li class="mb-2">
                  <div>${escapeHtml(q.text)}</div>
                  <div class="text-success small">
                    ✓ ${escapeHtml(q.options[q.correct])}
                  </div>
                  ${selectedAnswers[i] !== null && selectedAnswers[i] !== q.correct
                    ? `<div class="text-danger small">✗ Ваш ответ: ${escapeHtml(q.options[selectedAnswers[i]])}</div>`
                    : ''}
                </li>
              `).join('')}
            </ol>
          </details>
        `;

        document.getElementById('restartBtn').addEventListener('click', () => {
          resetQuiz();
        });
      }

      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str).replace(/[&<>"']/g, function(m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          if (m === '"') return '&quot;';
          if (m === "'") return '&#39;';
          return m;
        });
      }

      // Запуск
      init();
    })();
  </script>
</body>
</html>
